name: Release

# Flow: bump_version.js -> push tag vX.Y.Z[-stageN] -> everything below runs unattended:
# prepare (validate + notes + draft) -> builds (desktop matrix + companion) -> publish (checksums + undraft) -> winget
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v3.0.0-stable1'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate & draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fails early when the tag does not match package.json / tauri.conf.json / Cargo.toml / companion
      - name: Validate tag and generate release notes
        id: info
        run: node scripts/ci/prepare_release.mjs release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Robot Runner ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: true
          # Pre-release tags stay out of /releases/latest (stable update channel)
          prerelease: ${{ steps.info.outputs.prerelease == 'true' }}

  build-desktop:
    name: Build ${{ matrix.platform }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: ''
            rust_targets: ''
          - platform: macos
            os: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: linux
            os: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      # Build only: assets are renamed and uploaded by the next steps
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        with:
          args: ${{ matrix.args }}

      # Renames bundles to their release names and fails if any expected asset is missing
      - name: Collect release assets
        shell: bash
        run: node scripts/ci/collect_release_assets.mjs ${{ matrix.platform }} "${{ needs.prepare.outputs.version }}" release-assets

      - name: Upload assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  build-companion:
    name: Build companion
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      COMPANION_KEYSTORE_BASE64: ${{ secrets.COMPANION_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A stable signing key lets users update the APK in place; without it each build gets a new debug key
      - name: Configure release signing
        if: env.COMPANION_KEYSTORE_BASE64 != ''
        run: |
          echo "$COMPANION_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/companion-release.jks"
          echo "COMPANION_KEYSTORE_PATH=$RUNNER_TEMP/companion-release.jks" >> "$GITHUB_ENV"

      - name: Warn about debug signing
        if: env.COMPANION_KEYSTORE_BASE64 == ''
        run: echo "::warning::COMPANION_KEYSTORE_BASE64 secret is not set. companion.apk will be signed with an ephemeral debug key and users must uninstall the previous version before updating."

      - name: Build Companion APK
        env:
          COMPANION_KEYSTORE_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
          COMPANION_KEY_ALIAS: ${{ secrets.COMPANION_KEY_ALIAS }}
          COMPANION_KEY_PASSWORD: ${{ secrets.COMPANION_KEY_PASSWORD }}
        run: |
          chmod +x companion/gradlew
          cd companion
          ./gradlew assembleRelease

      - name: Collect release assets
        run: node scripts/ci/collect_release_assets.mjs android "${{ needs.prepare.outputs.version }}" release-assets

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Checksums & publish
    needs: [prepare, build-desktop, build-companion]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Generate and upload SHA256SUMS.txt
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      # Only reached when every build succeeded, so a partial release is never published
      - name: Publish release
        run: |
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
          echo "### 🚀 Published Robot Runner $RELEASE_TAG (${{ needs.prepare.outputs.channel }})" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  publish-winget:
    name: Submit to Winget
    # Runs after publishing (draft assets are not publicly downloadable) and only for stable releases
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: windows-latest
    steps:
      - name: Install WingetCreate
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit to Winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Warning "WINGET_TOKEN not set. Skipping submission."
            exit 0
          }

          $VERSION = $env:VERSION
          $URL = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/Robot.Runner_${VERSION}_windows_x64-setup.exe"

          # Update manifest locally first
          .\wingetcreate.exe update lucasdeeiroz.RobotRunner --version $VERSION --urls $URL --out .

          # Find the generated manifest directory (structure like manifests/l/...)
          $manifestDir = Get-ChildItem -Path . -Recurse -Directory | Where-Object { $_.Name -eq $VERSION } | Select-Object -First 1
          if (-not $manifestDir) {
            Write-Error "Could not find generated manifest directory."
            exit 1
          }

          Write-Host "Patching manifests in $($manifestDir.FullName)"
          $date = Get-Date -Format "yyyy-MM-dd"

          # 1. ReleaseNotesUrl in the locale manifest
          $localeManifest = Get-ChildItem -Path $manifestDir.FullName -Filter "*locale.en-US.yaml"
          if ($localeManifest) {
            $content = Get-Content $localeManifest.FullName -Raw
            if (-not ($content -match "ReleaseNotesUrl:")) {
              $releaseNotesUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
              $content = $content.Trim() + "`r`nReleaseNotesUrl: $releaseNotesUrl"
              Write-Host "Added ReleaseNotesUrl to $($localeManifest.Name)"
            }
            Set-Content -Path $localeManifest.FullName -Value $content -Encoding utf8
          }

          # 2. ReleaseDate in the version manifest
          $versionManifest = Get-ChildItem -Path $manifestDir.FullName -Filter "*.yaml" | Where-Object { $_.Name -notmatch "installer" -and $_.Name -notmatch "locale" } | Select-Object -First 1
          if ($versionManifest) {
            $content = Get-Content $versionManifest.FullName -Raw
            if (-not ($content -match "ReleaseDate:")) {
              $content = $content.Trim() + "`r`nReleaseDate: $date"
              Write-Host "Added ReleaseDate: $date to $($versionManifest.Name)"
            }
            Set-Content -Path $versionManifest.FullName -Value $content -Encoding utf8
          }

          Write-Host "Submitting manifest from $($manifestDir.FullName)"
          .\wingetcreate.exe submit $manifestDir.FullName --token $env:WINGET_TOKEN

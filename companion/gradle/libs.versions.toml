[versions]
ktx = "1.12.0"
coreKtx = "1.13.1"
activityCompose = "1.8.2"
composeBOM = "2024.02.00"
ui = "1.5.8"
uiGraphics = "1.5.8"
uiToolingPreview = "1.5.8"
material3 = "1.5.8"
lifecycleRuntimeKtx = "2.7.0"
nanohttpd = "2.3.1"
gson = "2.10.1"
androidGradlePlugin = "9.3.0"
kotlin = "2.3.21"

[libraries]

ktx = { module = "androidx.core:core-ktx", version.ref = "ktx" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
composeBOM = { module = "androidx.compose:compose-bom", version.ref = "composeBOM" }
ui = { module = "androidx.compose.ui:ui", version.ref = "ui" }
uiGraphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "uiGraphics" }
uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "uiToolingPreview" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
androidLibrary = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
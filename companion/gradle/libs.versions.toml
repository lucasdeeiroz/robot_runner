[versions]
activityKtx = "1.13.0"
composeBOM = "2026.06.01"
concurrentFuturesKtx = "1.3.0"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
nanohttpd = "2.3.1"
gson = "2.14.0"
androidGradlePlugin = "9.3.0"
kotlin = "2.4.10"

[libraries]

activityKtx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
composeBOM = { module = "androidx.compose:compose-bom", version.ref = "composeBOM" }
concurrentFuturesKtx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFuturesKtx" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
androidLibrary = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }